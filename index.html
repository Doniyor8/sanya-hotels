/* Layout: one night-sea terminal column; language bar → boot log → loot chart → radar map → hotel files */
:root {

html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 16px 64px;

a { color: var(--sea); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

.langbar { display: flex; justify-content: flex-end; gap: 6px; font-family: var(--f-mono); }
.langbar button { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; min-width: 52px; }
.langbar button[aria-pressed="true"] { color: var(--bg); background: var(--sea); border-color: var(--sea); font-weight: 700; }

.term { background: #030b10; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; font-family: var(--f-mono); font-size: 13px; line-height: 1.7; overflow-x: auto; }
.term p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.term .prompt { color: var(--sea); }
.term .ok { color: var(--ok); }
.term .warn { color: var(--sun); }
.term .dim { color: var(--muted); }
.cursor { display: inline-block; width: 8px; height: 1em; background: var(--sea); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 7vw, 58px); line-height: 1.15; margin: 0; letter-spacing: .5px; text-wrap: balance; }
.hero h1 .who { color: var(--sea); text-shadow: 0 0 18px rgba(63,224,200,.35); }
.hero .tag { font-family: var(--f-display); font-size: clamp(18px, 3.6vw, 26px); color: var(--sand); margin: 8px 0 0; }
.hero .sub { color: var(--muted); margin: 10px 0 0; max-width: 62ch; }

h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; }
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--sun); text-transform: uppercase; }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

.exploit { border: 1px dashed var(--sun); border-radius: 6px; padding: 16px; display: grid; gap: 10px; background: rgba(255,138,92,.06); }
.steps { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--f-mono); }
.steps .st { padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.steps .st s { color: var(--muted); }
.steps .st.win { border-color: var(--ok); color: var(--ok); }
.steps .arr { color: var(--muted); }

.bars { display: grid; gap: 8px; margin-top: 14px; font-variant-numeric: tabular-nums; }
.bar { display: grid; grid-template-columns: minmax(0, 12em) 1fr 5.5em; gap: 10px; align-items: center; font-size: 13px; }
.bar .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .track { position: relative; height: 14px; background: var(--panel); border-radius: 2px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--sea); border-radius: 2px; opacity: .85; }
.bar.yl .fill { background: var(--sand); }
.bar.bm .fill { background: var(--sun); }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); opacity: .5; }
.bar .v { font-family: var(--f-mono); text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.mapbox { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; }
.mapbox svg { display: block; width: 100%; height: auto; min-width: 320px; max-width: 100%; }
.sweep { transform-origin: 470px 150px; animation: sweep 6s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }

.dossiers { display: grid; gap: 28px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.card.bench { border-color: var(--sun); }
.card .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.card .head > div:first-child { min-width: 0; }

.card.bench .id { color: var(--sun); }
.card h3 { font-family: var(--f-display); font-weight: 400; font-size: 23px; margin: 2px 0 0; line-height: 1.25; }
.card .alt { color: var(--muted); font-size: 13px; }
.price { text-align: right; font-family: var(--f-mono); }
.price .big { font-size: 28px; font-weight: 700; color: var(--sand); line-height: 1.1; }
.price .per { font-size: 12px; color: var(--muted); }

.photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; max-width: 100%; }
.body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 12px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }

.card.bench .quip { color: var(--sun); border-color: var(--sun); }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-block; text-decoration: none; font-family: var(--f-mono); font-size: 13px; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--sea); color: var(--sea); }

footer { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }
footer b { color: var(--sea); font-weight: 400; }

@media (max-width: 560px) {

  .price { text-align: left; }
  .card h3 { font-size: 20px; }

@media (prefers-reduced-motion: reduce) { .cursor, .sweep { animation: none; } }

const amap = h => "https://uri.amap.com/marker?position=" + h.lng + "," + h.lat + "&name=" + encodeURIComponent(h.name.zh) + "&coordinate=gaode&callnative=1";
const mainName = (h, L) => L === "zh" ? h.name.zh : h.name.en;
const altName = (h, L) => L === "zh" ? h.name.en : h.name.zh;
const shortName = (h, L) => L === "zh" ? h.short.zh : h.short.en;

function render(L) {
  const t = T[L], fmt = n => "¥" + n.toLocaleString(t.locale);
  document.documentElement.lang = L === "zh" ? "zh-CN" : L;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".langbar button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === L)));

  document.getElementById("term").innerHTML =
    `<p><span class="prompt">root@doni-hq:~$</span> ./sanya_hotel_scan --bays=yalong,haitang --dates=11.07-11.10 --view=ocean</p>` +
    `<p class="dim">${t.term[0]}</p><p class="ok">${t.term[1]}</p><p class="warn">${t.term[2]}</p>` +
    `<p class="ok">${t.term[3]} <span class="cursor" aria-hidden="true"></span></p>`;

  const max = 2000;
  document.getElementById("bars").innerHTML = [...H].sort((a, b) => a.price - b.price).map(h => {
    const cls = h.bench ? "bm" : (h.bay === "yalong" ? "yl" : "");
    return `<div class="bar ${cls}"><span class="nm" title="${mainName(h, L)}">${shortName(h, L)}</span>
      <span class="track"><span class="fill" style="width:${(h.price / max * 100).toFixed(1)}%"></span><span class="mark" style="left:${(850 / max * 100).toFixed(1)}%"></span></span>
      <span class="v">${fmt(h.price)}</span></div>`;
  }).join("");

  /* radar map from real coordinates */
  const svg = document.getElementById("map");
  svg.setAttribute("aria-label", t.mapAria);
  const L0 = 109.60, L1 = 109.80, A0 = 18.20, A1 = 18.42;
  const X = lng => 30 + (lng - L0) / (L1 - L0) * 400, Y = lat => 20 + (A1 - lat) / (A1 - A0) * 430;
  const mono = 'font-family="JetBrains Mono, monospace"', disp = 'font-family="Russo One, ZCOOL QingKe HuangYou, sans-serif"';
  let s = "";
  for (let i = 0; i <= 8; i++) { const x = 30 + i * 50; s += `<line x1="${x}" y1="20" x2="${x}" y2="450" stroke="var(--line)"/>`; }
  for (let i = 0; i <= 8; i++) { const y = 20 + i * 53.75; s += `<line x1="30" y1="${y}" x2="430" y2="${y}" stroke="var(--line)"/>`; }
  [60, 120, 180].forEach(r => s += `<circle cx="470" cy="150" r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/>`);
  s += `<g class="sweep"><path d="M470 150 L650 150 A180 180 0 0 0 597 23 Z" fill="var(--sea)" opacity=".07"/></g>`;
  H.filter(h => h.bay === "haitang").forEach(h => {
    const x = X(h.lng), y = Y(h.lat), c = h.bench ? "var(--sun)" : "var(--sea)", right = h.n !== 7;
    s += `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${c}" opacity=".5"/><circle cx="${x}" cy="${y}" r="4.5" fill="${c}"/>`;
    s += `<text x="${right ? x + 14 : x - 14}" y="${y + 4}" fill="${c}" ${mono} font-size="13" text-anchor="${right ? "start" : "end"}">#${h.n} ${shortName(h, L)}</text>`;
  });
  s += `<text x="${X(109.705)}" y="${Y(18.385)}" fill="var(--muted)" ${disp} font-size="20">${t.haitang}</text>`;
  const cx = X(109.6334), cy = Y(18.2273);
  s += `<circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="var(--sand)"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--sand)"/>`;
  s += `<text x="${cx + 14}" y="${cy - 14}" fill="var(--sand)" ${disp} font-size="20">${t.yalong} #2–#5</text>`;
  const bx = 290, by = 300, bw = 330, bh = 150;
  s += `<line x1="${cx + 10}" y1="${cy}" x2="${bx}" y2="${by + bh / 2}" stroke="var(--sand)" stroke-dasharray="4 4" opacity=".6"/>`;
  s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="var(--bg)" stroke="var(--sand)" rx="4"/>`;
  s += `<text x="${bx + 10}" y="${by + 18}" fill="var(--sand)" ${mono} font-size="11">${t.zoom}</text>`;
  const zl0 = 109.6275, zl1 = 109.6400, za0 = 18.2255, za1 = 18.2300;
  H.filter(h => h.bay === "yalong").forEach(h => {
    const x = bx + 20 + (h.lng - zl0) / (zl1 - zl0) * (bw - 150), y = by + 34 + (za1 - h.lat) / (za1 - za0) * (bh - 60);
    s += `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--sand)"/><text x="${x + 9}" y="${y + 4}" fill="var(--fg)" ${mono} font-size="12">#${h.n} ${shortName(h, L)}</text>`;
  });
  s += `<text x="30" y="466" fill="var(--muted)" ${mono} font-size="11">${t.mapFoot}</text>`;
  s += `<text x="420" y="36" fill="var(--muted)" ${mono} font-size="12" text-anchor="end">N ↑</text>`;
  svg.innerHTML = s;

  document.getElementById("dossiers").innerHTML = H.map(h => `
    <article class="card${h.bench ? " bench" : ""}" id="hotel-${h.n}">
      <div class="head">
        <div>
          <div class="id">${t.file} #${h.n} · ${t[h.bay]}${h.bench ? " · " + t.yours : ""}</div>
          <h3>${mainName(h, L)}</h3>
          <div class="alt">${altName(h, L)}</div>
        </div>
        <div class="price"><div class="big">${fmt(h.price)}</div><div class="per">${t.per}</div></div>
      </div>
      <div class="photos">
        <img src="img/${h.n}-1.jpg" alt="${mainName(h, L)} 1" loading="lazy">
        <img src="img/${h.n}-2.jpg" alt="${mainName(h, L)} 2" loading="lazy">
      </div>
      <div class="body">
        <div class="stats">
          <span class="chip${h.rating >= 9.5 ? " hot" : ""}">${t.rating} ${h.rating}/10</span>
          <span class="chip">${h.reviews.toLocaleString(t.locale)} ${t.reviews}</span>
          <span class="chip">${h.km === 0 ? t.base : t.fromM(h.km)}</span>
        </div>
        <div class="room">${t.room}: <b>${h.room[L]}</b>${h.extra ? " · " + h.extra[L] : ""}</div>
        <ul>${h.hi[L].map(x => `<li>${x}</li>`).join("")}</ul>
        <div class="quip">${h.quip[L]}</div>
        <div class="links">
          <a class="btn" href="${amap(h)}" target="_blank" rel="noopener">${t.nav}</a>
          ${h.link ? `<a class="btn alt2" href="${h.link}" target="_blank" rel="noopener">${t.trip}</a>` : ""}
        </div>
      </div>
    </article>`).join("");
}

let lang = "ru";
try { const saved = localStorage.getItem("sanya-lang"); if (saved && T[saved]) lang = saved; } catch (e) {}
document.querySelectorAll(".langbar button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; render(lang);
  try { localStorage.setItem("sanya-lang", lang); } catch (e) {}
}));
render(lang);
</script>
