/* order: your hotel first, then ¥600–1,000 by price, then the pricier ones, then the cheaper one */
const sea = h => h.p[2];
const grp = h => h.bench ? 0 : (sea(h) >= 600 && sea(h) <= 1000 ? 1 : (sea(h) > 1000 ? 2 : 3));
H.sort((a, b) => grp(a) - grp(b) || sea(a) - sea(b));
H.forEach((h, i) => h.n = i + 1);

const bayColor = { haitang: "var(--sea)", yalong: "var(--sand)", dadonghai: "var(--dh)", sanyabay: "var(--sb)" };
const amap = h => "https://uri.amap.com/marker?position=" + h.lng + "," + h.lat + "&name=" + encodeURIComponent(h.name.zh) + "&coordinate=gaode&callnative=1";
const mainName = (h, L) => L === "zh" ? h.name.zh : h.name.en;
const altName = (h, L) => L === "zh" ? h.name.en : h.name.zh;
const shortName = (h, L) => L === "zh" ? h.short.zh : h.short.en;

function render(L) {
  const t = T[L], fmt = n => "¥" + n.toLocaleString(t.locale);
  document.documentElement.lang = L === "zh" ? "zh-CN" : L;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".langbar button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === L)));

  document.getElementById("term").innerHTML =
    `<p><span class="prompt">root@doni-hq:~$</span> ./sanya_hotel_scan --bays=haitang,yalong,dadonghai,sanya --dates=11.07-11.10 --view=ocean --breakfast=both</p>` +
    `<p class="dim">${t.term[0]}</p><p class="ok">${t.term[1]}</p><p class="warn">${t.term[2]}</p>` +
    `<p class="ok">${t.term[3]} <span class="cursor" aria-hidden="true"></span></p>`;

  const max = 2000;
  document.getElementById("bars").innerHTML = [...H].sort((a, b) => sea(a) - sea(b)).map(h => {
    const c = h.bench ? "var(--sun)" : bayColor[h.bay];
    return `<div class="bar"><span class="nm" title="${mainName(h, L)}">${shortName(h, L)}</span>
      <span class="track"><span class="fill" style="width:${(sea(h) / max * 100).toFixed(1)}%;background:${c}"></span><span class="mark" style="left:${(850 / max * 100).toFixed(1)}%"></span></span>
      <span class="v">${fmt(sea(h))}</span></div>`;
  }).join("");
  document.getElementById("legend").innerHTML =
    `<span><i style="background:var(--sun)"></i>${t.lgBench}</span>` +
    Object.keys(bayColor).map(k => `<span><i style="background:${bayColor[k]}"></i>${t.bays[k]}</span>`).join("") +
    `<span><i style="background:var(--fg);opacity:.5"></i>${t.lgLine}</span>`;

  /* radar map from real coordinates */
  const svg = document.getElementById("map");
  svg.setAttribute("aria-label", t.mapAria);
  const L0 = 109.41, L1 = 109.80, A0 = 18.20, A1 = 18.42;
  const X = lng => 20 + (lng - L0) / (L1 - L0) * 600, Y = lat => 20 + (A1 - lat) / (A1 - A0) * 340;
  const mono = 'font-family="JetBrains Mono, monospace"', disp = 'font-family="Russo One, ZCOOL QingKe HuangYou, sans-serif"';
  let s = "";
  for (let i = 0; i <= 12; i++) { const x = 20 + i * 50; s += `<line x1="${x}" y1="20" x2="${x}" y2="360" stroke="var(--line)"/>`; }
  for (let i = 0; i <= 7; i++) { const y = 20 + i * 48.6; s += `<line x1="20" y1="${y}" x2="620" y2="${y}" stroke="var(--line)"/>`; }
  [60, 120, 180].forEach(r => s += `<circle cx="520" cy="120" r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/>`);
  s += `<g class="sweep"><path d="M520 120 L700 120 A180 180 0 0 0 647 -7 Z" fill="var(--sea)" opacity=".07"/></g>`;
  const pin = (h, label, anchor, dx) => {
    const x = X(h.lng), y = Y(h.lat), c = h.bench ? "var(--sun)" : bayColor[h.bay];
    return `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${c}" opacity=".5"/><circle cx="${x}" cy="${y}" r="4.5" fill="${c}"/>` +
      `<text x="${x + dx}" y="${y + 4}" fill="${c}" ${mono} font-size="12" text-anchor="${anchor}">${label}</text>`;
  };
  H.filter(h => h.bay === "haitang").sort((a, b) => b.lat - a.lat).forEach(h => {
    s += pin(h, `#${h.n} ${shortName(h, L)}`, "end", -14);
  });
  H.filter(h => h.bay === "sanyabay").forEach(h => { s += pin(h, `#${h.n} ${shortName(h, L)}`, "start", 14); });
  const cluster = (bay, lat, lng, dy, anchor) => {
    const list = H.filter(h => h.bay === bay).sort((a, b) => a.n - b.n);
    const x = X(lng), y = Y(lat), c = bayColor[bay];
    s += `<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="${c}"/><circle cx="${x}" cy="${y}" r="5" fill="${c}"/>`;
    s += `<text x="${x}" y="${y + dy}" fill="${c}" ${disp} font-size="17" text-anchor="${anchor}">${t.bays[bay]}</text>`;
    s += `<text x="${x}" y="${y + dy + 18}" fill="var(--fg)" ${mono} font-size="12" text-anchor="${anchor}">${list.map(h => "#" + h.n).join(" ")}</text>`;
  };
  cluster("yalong", 18.2290, 109.6400, 30, "middle");
  cluster("dadonghai", 18.2190, 109.5180, 30, "middle");
  s += `<text x="${X(109.70)}" y="${Y(18.405)}" fill="var(--muted)" ${disp} font-size="18" text-anchor="end">${t.bays.haitang}</text>`;
  s += `<text x="20" y="390" fill="var(--muted)" ${mono} font-size="11">${t.mapFoot}</text>`;
  s += `<text x="612" y="36" fill="var(--muted)" ${mono} font-size="12" text-anchor="end">N ↑</text>`;
  svg.innerHTML = s;

  document.getElementById("dossiers").innerHTML = H.map(h => `
    <article class="card${h.bench ? " bench" : ""}" id="hotel-${h.n}">
      <div class="head">
        <div>
          <div class="id">${t.file} #${h.n} · ${t.bays[h.bay]}${h.bench ? " · " + t.yours : ""}</div>
          <h3>${mainName(h, L)}</h3>
          <div class="alt">${altName(h, L)}</div>
        </div>
        <div class="price"><div class="big">${fmt(sea(h))}</div><div class="per">${t.per}</div></div>
      </div>
      <div class="photos">
        <img src="img/${h.id}-1.jpg" alt="${mainName(h, L)} 1" loading="lazy">
        <img src="img/${h.id}-2.jpg" alt="${mainName(h, L)} 2" loading="lazy">
        <figure><img src="img/${h.id}-room.jpg" alt="${h.room[L]}" loading="lazy"><figcaption>${t.roomPhoto}: ${h.room[L]}</figcaption></figure>
      </div>
      <div class="body">
        <div class="stats">
          <span class="chip${h.rating >= 9.5 ? " hot" : ""}">${t.rating} ${h.rating}/10</span>
          <span class="chip">${h.reviews.toLocaleString(t.locale)} ${t.reviews}</span>
          <span class="chip">${h.km === 0 ? t.base : t.fromM(h.km)}</span>
        </div>
        <div class="ptable-wrap"><table class="ptable">
          <thead><tr><th>${t.pricesNight}</th><th>${t.noBf}</th><th>${t.bf}</th></tr></thead>
          <tbody>
            <tr><td>${t.anyRoom}</td><td>${fmt(h.p[0])}</td><td>${fmt(h.p[1])}</td></tr>
            <tr class="sea"><td>${t.seaRoom}<span class="rn">${h.room[L]}</span></td><td>${fmt(h.p[2])}</td><td>${fmt(h.p[3])}</td></tr>
          </tbody>
        </table></div>
        <ul>${h.hi[L].map(x => `<li>${x}</li>`).join("")}</ul>
        <div class="quip">${h.quip[L]}</div>
        <div class="links">
          <a class="btn" href="${amap(h)}" target="_blank" rel="noopener">${t.nav}</a>
          ${h.link ? `<a class="btn alt2" href="${h.link}" target="_blank" rel="noopener">${t.trip}</a>` : ""}
        </div>
      </div>
    </article>`).join("");
}

let lang = "ru";
try { const saved = localStorage.getItem("sanya-lang"); if (saved && T[saved]) lang = saved; } catch (e) {}
document.querySelectorAll(".langbar button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; render(lang);
  try { localStorage.setItem("sanya-lang", lang); } catch (e) {}
}));
render(lang);
</script>

</body>
</html>
