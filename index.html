/* 5-diamond hotels first, then 4-diamond; each group by sea-view price */
H.sort((a, b) => b.dia - a.dia || a.p[2] - b.p[2]);
H.forEach((h, i) => h.n = i + 1);

const amap = h => "https://uri.amap.com/marker?position=" + h.lng + "," + h.lat + "&name=" + encodeURIComponent(h.name.zh) + "&coordinate=gaode&callnative=1";
const nm = (h, L) => L === "zh" ? h.name.zh : h.name.en;
const alt = (h, L) => L === "zh" ? h.name.en : h.name.zh;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render(L) {
  const t = T[L], fmt = n => "¥" + n.toLocaleString(t.locale);
  const yr = h => h.type === "opened" ? t.opened(h.year) : t.renov(h.year);
  document.documentElement.lang = L === "zh" ? "zh-CN" : L;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".langbar button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === L)));

  document.getElementById("overview").innerHTML =
    `<thead><tr><th>${t.hHotel}</th><th>${t.hYear}</th><th>${t.hSea}</th><th>${t.hSeaBf}</th><th>${t.hRating}</th></tr></thead><tbody>` +
    H.map(h => `<tr><td><a href="#h${h.n}">${h.n}. ${esc(nm(h, L))}</a><small>${t.bays[h.bay]} · ${t.stars(h.dia)}</small></td>
      <td>${h.year}</td><td>${fmt(h.p[2])}</td><td>${fmt(h.p[3])}</td><td>${h.rating}</td></tr>`).join("") + `</tbody>`;

  document.getElementById("cards").innerHTML = H.map(h => `
    <article class="card" id="h${h.n}">
      <div class="head">
        <div>
          <div class="num">${h.n} / ${H.length} · ${t.bays[h.bay]}</div>
          <h3>${esc(nm(h, L))}</h3>
          <div class="alt">${esc(alt(h, L))}</div>
        </div>
        <div class="price"><b>${fmt(h.p[2])}</b><span>${t.perNight}</span></div>
      </div>
      <div class="chips">
        <span class="chip">${yr(h)}</span>
        <span class="chip plain">${t.stars(h.dia)}</span>
        <span class="chip plain">${h.rating}/10 · ${h.reviews.toLocaleString(t.locale)} ${t.reviews}</span>
      </div>
      <div class="photos">
        <img src="p/${h.id}-1.jpg" alt="${esc(nm(h, L))}" loading="lazy">
        <img src="p/${h.id}-2.jpg" alt="${esc(nm(h, L))}" loading="lazy">
        <figure><img src="p/${h.id}-room.jpg" alt="${esc(h.room[L])}" loading="lazy"><figcaption>${t.roomPhoto}: ${esc(h.room[L])}</figcaption></figure>
      </div>
      <div class="body">
        <div class="ptable"><table>
          <thead><tr><th>${t.pTitle}</th><th>${t.noBf}</th><th>${t.bf}</th></tr></thead>
          <tbody>
            <tr><td>${t.anyRoom}</td><td>${fmt(h.p[0])}</td><td>${fmt(h.p[1])}</td></tr>
            <tr class="sea"><td>${t.seaRoom}<small>${esc(h.room[L])}</small></td><td>${fmt(h.p[2])}</td><td>${fmt(h.p[3])}</td></tr>
          </tbody>
        </table></div>
        ${h.warn ? `<div class="warn">${h.warn[L]}</div>` : ""}
        <ul>${h.hi[L].map(x => `<li>${x}</li>`).join("")}</ul>
        <div class="links">
          <a class="btn solid" href="${h.link}" target="_blank" rel="noopener">${t.trip}</a>
          <a class="btn" href="${amap(h)}" target="_blank" rel="noopener">${t.nav}</a>
        </div>
      </div>
    </article>`).join("");
}

let lang = "ru";
try { const s = localStorage.getItem("sanya-new-lang"); if (s && T[s]) lang = s; } catch (e) {}
document.querySelectorAll(".langbar button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; render(lang);
  try { localStorage.setItem("sanya-new-lang", lang); } catch (e) {}
}));
render(lang);
</script>
